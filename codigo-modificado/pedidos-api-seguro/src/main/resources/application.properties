# =====================================================================
# Práctica 1 - Versión SEGURA - Configuración de base de datos
# H2 en memoria: funciona sin configuracion adicional (Codespaces).
# =====================================================================

spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga de data.sql despues de que Hibernate crea el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded

# ✅ SEGURO (esquema estricto): si el JSON trae una propiedad que no existe en
# el DTO (p. ej. "rol" o "id" al registrar), la peticion se rechaza con 400
# en lugar de ignorarla silenciosamente. Mitiga Mass Assignment (API3:2023).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------------
# Para usar MySQL en lugar de H2 (los alumnos ya tienen MySQL):
# 1) Cree la base de datos:  CREATE DATABASE ciberpedidos;
# 2) Comente las lineas de H2 anteriores y descomente estas:
# spring.datasource.url=jdbc:mysql://localhost:3306/ciberpedidos?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=TU_CONTRASENA
# spring.sql.init.mode=always
# ---------------------------------------------------------------------
